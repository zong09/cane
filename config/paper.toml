profile    = "paper"
timeframe  = "1d"
cold_start = "wait_1h"
base_pct   = 10.0
dry_run    = true
allow_short = true

[[symbols]]
symbol             = "BTC/USDT"
market             = "usdtm_perp"   # usdtm_perp | spot — ต่อเหรียญ ไม่ใช่ต่อ profile
bucket_quote_long  = 100.0
bucket_quote_short = 60.0
leverage           = 1.0
allow_short        = true
enabled            = true

# เหรียญ spot — long-only: ขายชอร์ตไม่ได้ ไม่มีอัตราทด ไม่มีกระเป๋าฝั่ง short
# มีไว้ใน paper ตั้งแต่แรกเพื่อให้เส้นทาง spot มีของจริงเดินผ่าน ไม่ใช่โค้ดที่ไม่เคยรัน
[[symbols]]
symbol             = "ETH/USDT"
market             = "spot"
bucket_quote_long  = 80.0
leverage           = 1.0
allow_short        = false
enabled            = true

[risk]
max_position_pct_long    = 50.0
max_position_pct_short   = 40.0
max_leverage             = 2.0
min_liq_buffer_pct       = 35.0
max_daily_loss_pct       = 5.0
consecutive_loss_breaker = 4

[broker]
kind          = "paper"
margin_mode   = "isolated"
position_mode = "one_way"
seed_quote    = 10000.0

[data]
exchange = "binance"
