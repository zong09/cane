[project]
name = "cane"
version = "0.1.0"
description = "บอทเทรด CDC Action Zone บน USDT-M perp"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "ccxt>=4.5.77",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
# ยังไม่ใช่ทางเข้าของตัวบอท — มีแค่งานฐานข้อมูล (`cane db seed`)
cane = "cane.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# adapter ที่คุยกับ Anthropic (`confluence/anthropic_client.py`) · เป็น extra ไม่ใช่
# dependency หลัก เพราะ **ยังไม่เคยถูกติดตั้งหรือรันเลยสักครั้ง** ในสภาพแวดล้อมนี้
# — ไม่มีคีย์ และยังไม่รู้ว่า Zscaler บล็อกทางไป Anthropic ด้วยไหม · การใส่ไว้ใน
# deps หลักจะทำให้ `uv sync` ดึงแพ็กเกจที่ไม่มีเทสต์ไหนแตะเข้ามาเงียบๆ
llm = [
    "anthropic>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# เทสต์ที่แตะ Postgres ติด marker นี้ · ชุดที่ไม่แตะต้องรันได้โดยไม่มี DB
#   uv run --extra dev pytest -q -m "not db"
markers = [
    "db: ต้องมี Postgres ที่ migrate แล้ว (docker compose up -d db)",
]
