[project]
name = "cane"
version = "0.1.0"
description = "บอทเทรด CDC Action Zone บน USDT-M perp"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "ccxt>=4.5.77",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.52",
    # คอนโซล (ใบ 19) · ADR 20 — server-rendered ไม่มี build step ไม่มีภาษาที่สอง
    # อยู่ใน dependencies หลักไม่ใช่ extra เพราะ engine กับคอนโซลเป็น deployable
    # เดียวกัน · ค่า import ของ web stack ไม่ตกใส่ engine ลูก เพราะ `cane serve`
    # import มันข้างในฟังก์ชัน ไม่ใช่ระดับโมดูล
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[project.scripts]
# ยังไม่ใช่ทางเข้าของตัวบอท — มีแค่งานฐานข้อมูล (`cane db seed`)
cane = "cane.cli:main"

[project.optional-dependencies]
dev = [
    # `fastapi.testclient.TestClient` ต้องมี httpx · เป็น dependency ที่ประกาศจริง
    # ไม่ใช่ของที่ติดมากับ ccxt แบบ `requests` (ดู `confluence/openai_client.py`)
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# เทสต์ที่แตะ Postgres ติด marker นี้ · ชุดที่ไม่แตะต้องรันได้โดยไม่มี DB
#   uv run --extra dev pytest -q -m "not db"
markers = [
    "db: ต้องมี Postgres ที่ migrate แล้ว (docker compose up -d db)",
    # เทสต์ที่ spawn process จริงแล้วรอ heartbeat — ช้ากว่าที่เหลือทั้งชุดรวมกัน
    #   uv run --env-file .env --extra dev pytest -q -m "not slow"
    "slow: spawn process จริงและรอเวลาจริง (ใบ 18)",
]
